[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[project]
name = "attachments"
version = "1.0.0a0"  # successor to the published `attachments` 0.25.x (see VISION.md)
description = "Turn anything into LLM-ready artifacts. Universal file and source processing."
readme = "README.md"
requires-python = ">=3.12"

# ZERO required dependencies - everything is optional
dependencies = []

[project.optional-dependencies]
# === Individual Processors ===
pdf = [
    "pypdf>=4.0",           # Modern pypdf (not pypdf2)
    "pymupdf>=1.24",        # For image rendering
]
pdf-fallback = [
    "pdfminer.six>=20221105",  # Fallback text extraction
]
xlsx = [
    "openpyxl>=3.1,<4.0",
]
xlsx-pandas = [
    "pandas>=2.0,<3.0",
    "openpyxl>=3.1,<4.0",
]
docx = [
    "python-docx>=1.0",
]
html = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

# === Service Mode (minimal - just HTTP client) ===
service = [
    "httpx>=0.27",
]

# === Convenience Bundles ===
# Only formats with shipped processors belong here. New processors (pptx,
# images, audio, s3://, gdrive://, ...) are added as they land - see VISION.md.
office = [
    "attachments[xlsx,docx]",
]
all-local = [
    "attachments[pdf,pdf-fallback,xlsx-pandas,docx,html]",
]

# === Self-Hosted Server ===
# Install this on your server machine to serve all formats to clients
server = [
    "attachments[all-local]",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    "pre-commit",
    # Service mode for testing
    "httpx>=0.27",
    # Common processors for testing
    "pypdf>=4.0",
    "pymupdf>=1.24",
    "openpyxl>=3.1,<4.0",
    "pandas>=2.0,<3.0",
    "python-docx>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # Dev tools
    "ipykernel>=6.30.1",
    "gunicorn>=25.0",
]

[project.scripts]
attachments-server = "attachments.server:main"
attachments = "attachments.cli:app"
att = "attachments.cli:app"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["docs/_freeze", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --color=yes --cov=attachments --cov-report=term-missing --doctest-modules"
testpaths = ["tests", "src"]
