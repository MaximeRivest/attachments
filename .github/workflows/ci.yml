name: CI
on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # see every version that fails, not just the first
      matrix:
        # Oldest and newest supported, plus the one the deploy image uses.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync (locked)
        run: uv sync --locked

      - name: Chromium for web page screenshot tests
        run: uv run playwright install --with-deps --only-shell chromium

      - name: LibreOffice for .doc/.ppt/.odt/.odp/.ods tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer-nogui libreoffice-impress-nogui libreoffice-calc-nogui

      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Test
        run: uv run pytest -q

