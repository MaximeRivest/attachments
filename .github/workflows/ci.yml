name: CI
on:
  push:
    branches: ["main", "master"]
  pull_request:
  # The release workflow (publish-to-pypi.yml) runs this same suite on the
  # tagged commit before anything is published.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # see every version that fails, not just the first
      matrix:
        # Oldest and newest supported, plus the one the deploy image uses.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and set Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync (locked)
        run: uv sync --locked

      - name: Chromium for web page screenshot tests
        run: uv run playwright install --with-deps --only-shell chromium

      - name: LibreOffice for .doc/.ppt/.odt/.odp/.ods tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer-nogui libreoffice-impress-nogui libreoffice-calc-nogui

      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: MCP server on the older SDK (mcp 1.x; the lock has 2.x)
        run: uv run --with "mcp>=1.17,<2" pytest -q -o addopts="" tests/test_mcp_server.py


  # Each extra alone, the way people install them. The suite above has every
  # extra at once, so it cannot see an extra that is not enough for its own
  # format: 1.0.0 shipped attachments[pdf] failing every scanned PDF (Pillow
  # was imported before it was needed), with the advice "pip install PIL".
  extras:
    name: extras (${{ matrix.extras || 'bare' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extras: ["", "pdf", "image", "docx", "pptx", "xlsx", "html", "svg", "office", "pdf,ocr", "all-local"]
    env:
      EXTRAS: ${{ matrix.extras }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and set Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      - name: Build the package
        run: uv build --wheel -o dist

      - name: Install it with these extras only
        run: |
          wheel="$PWD/$(ls dist/*.whl)"
          uv venv /tmp/env
          if [ -n "$EXTRAS" ]; then req="attachments[$EXTRAS] @ file://$wheel"; else req="attachments @ file://$wheel"; fi
          VIRTUAL_ENV=/tmp/env uv pip install "$req"

      - name: Read every sample file
        working-directory: /tmp
        run: /tmp/env/bin/python "$GITHUB_WORKSPACE/tests/extras/check.py" "$EXTRAS"
