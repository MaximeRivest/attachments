name: Publish to PyPI

# Pushing a tag like v1.0.0b1 or v1.0.0 publishes that version:
#   1. the full test suite runs on the tagged commit (ci.yml);
#   2. the package is built once, checked, and installed into clean
#      environments to prove it works from the files PyPI will serve;
#   3. those exact files are uploaded to PyPI, signed by this workflow
#      (trusted publishing: no password or token is stored anywhere);
#   4. a GitHub release is created with the changelog section and the files.
#
# Run it by hand ("Run workflow" on GitHub) to do steps 1-2 only: a dry run.
#
# PyPI trusts this file by its name, publish-to-pypi.yml. Renaming it breaks
# publishing until the trusted publisher is updated on pypi.org.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: the tag must be on main
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: false # never build a release from a restored cache

      - name: Read the version
        id: version
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version in pyproject.toml: $VERSION"

      - name: The tag matches the version and is on main
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version ${{ steps.version.outputs.version }} in pyproject.toml"
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi

      - name: The changelog has a section for this version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"
            exit 1
          fi
          # Relative links (docs/MIGRATION.md) would break on the release
          # page; point them at the tagged files on GitHub.
          sed -i -E "s#\]\(\.?/?([^):\#][^):]*\.[^):]*)\)#](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/\1)#g" release-notes.md

      - name: Build
        run: uv build --no-sources

      - name: Check the package metadata
        run: uvx twine check --strict dist/*

      - name: Smoke test the wheel (no extras)
        run: |
          uv venv --python 3.11 /tmp/core
          uv pip install --python /tmp/core dist/*.whl
          /tmp/core/bin/python - <<'EOF'
          import attachments
          from attachments import att
          assert attachments.__version__ == "${{ steps.version.outputs.version }}", attachments.__version__
          a = att("README.md")
          assert "error" not in a[0]["meta"], a[0]["meta"]
          assert "attachments" in a.text
          print("core ok:", repr(a))
          EOF
          /tmp/core/bin/att --help > /dev/null

      - name: Smoke test the wheel (PDF extra)
        run: |
          uv venv --python 3.13 /tmp/pdf
          uv pip install --python /tmp/pdf "$(ls dist/*.whl)[pdf]"
          /tmp/pdf/bin/python - <<'EOF'
          import pymupdf
          from attachments import att
          doc = pymupdf.open()
          doc.new_page().insert_text((72, 72), "Hello from the release check")
          doc.save("/tmp/check.pdf")
          a = att("/tmp/check.pdf[images: true]")
          assert "Hello from the release check" in a.text, a.text
          assert len(a.images) == 1, a.images
          print("pdf ok:", repr(a))
          EOF

      - name: Smoke test the source archive
        run: |
          uv venv --python 3.12 /tmp/sdist
          uv pip install --python /tmp/sdist dist/*.tar.gz
          /tmp/sdist/bin/python -c "import attachments; print('sdist ok:', attachments.__version__)"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push'
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # trusted publishing and signed attestations
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true

  github-release:
    name: GitHub release
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "${GITHUB_REF_NAME#v}" in *a*|*b*|*rc*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "attachments ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md $PRE
