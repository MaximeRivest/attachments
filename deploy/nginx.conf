# nginx for api.attachments.dev — TLS termination, rate limiting, proxy to
# gunicorn (api:8000 on the compose network).
#
# Mounted as the FULL /etc/nginx/nginx.conf (see docker-compose.yml).
# Validate inside the container: docker compose exec nginx nginx -t

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Access log with upstream timing so slow OCR requests are visible.
    log_format main_timed '$remote_addr - [$time_local] "$request" '
                          '$status $body_bytes_sent rt=$request_time '
                          'urt=$upstream_response_time "$http_user_agent"';
    access_log /var/log/nginx/access.log main_timed;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    server_tokens off;

    # ---- Rate limiting -----------------------------------------------------
    # Heavy POSTs (/process, /unpack): 10 requests/minute per IP, burst 20.
    limit_req_zone $binary_remote_addr zone=heavy:10m rate=10r/m;
    # GETs (/health, /formats, /options): cheap, be generous.
    limit_req_zone $binary_remote_addr zone=light:10m rate=2r/s;
    # Max concurrent connections per IP.
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # ---- Upload cap (FREE tier) ---------------------------------------------
    # 25 MB — keep aligned with ATTACHMENTS_MAX_UPLOAD=26214400 on the api
    # service so nginx rejects oversized bodies before they hit gunicorn.
    client_max_body_size 25m;
    client_body_timeout 60s;

    upstream attachments_api {
        server api:8000;
        keepalive 16;
    }

    # ---- HTTP: ACME challenge + redirect to HTTPS ---------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name api.attachments.dev;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS ---------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name api.attachments.dev;

        ssl_certificate     /etc/letsencrypt/live/api.attachments.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.attachments.dev/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1h;

        # Security headers (API responses are JSON; no framing/sniffing).
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        limit_conn perip 10;

        # Shared proxy settings. OCR on a big PDF can take ~30s+; allow 120.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
        proxy_request_buffering on;   # buffer the upload, free the client fast

        location = /process {
            limit_req zone=heavy burst=20 nodelay;
            proxy_pass http://attachments_api;
        }

        location = /unpack {
            limit_req zone=heavy burst=20 nodelay;
            proxy_pass http://attachments_api;
        }

        location / {
            # /health, /formats, /options and 404s.
            limit_req zone=light burst=30 nodelay;
            proxy_pass http://attachments_api;
        }
    }
}
