# api.attachments.dev — production stack (CPU free-tier instance)
#
# Usage (on the EC2 box, from the repo root):
#   cp deploy/free-tier.env.example deploy/.env   # then review it
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# Layout: nginx terminates TLS on 80/443 and proxies to the api service on
# the internal network. certbot renews via webroot. Nothing is stateful
# except the Let's Encrypt volume.

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      # 2 workers fits a 2-vCPU instance (c7a.large); set 4 on c7a.xlarge.
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
      # Empty key = open free tier (see free-tier.env.example for tradeoff).
      - ATTACHMENTS_SERVER_KEY=${ATTACHMENTS_SERVER_KEY:-}
      # 25 MB free-tier cap — keep aligned with client_max_body_size in nginx.conf.
      - ATTACHMENTS_MAX_UPLOAD=${ATTACHMENTS_MAX_UPLOAD:-26214400}
      # OCR pages per document, even with ocr: true. m6i.large (2 vCPU = one
      # core, hyperthreaded) reads ~4.5 s a page (measured): 10 pages finish
      # within the client's default 60 s service timeout.
      - ATTACHMENTS_OCR_MAX_PAGES=${ATTACHMENTS_OCR_MAX_PAGES:-10}
      # SSRF guard stays ON: do not set ATTACHMENTS_ALLOW_PRIVATE_URLS in prod.
      # --- GPU phase 2: uncomment with the vllm service below ---
      # - ATTACHMENTS_LIGHTON_URL=http://<gpu-instance-private-ip>:8100/v1
    expose:
      - "8000"
    # Belt-and-braces resource caps so one bad request can't take the box down.
    # Each worker peaks ~1.2 GB reading a scan (measured, 2 cores); 2 workers
    # + LibreOffice need more than 3 GB. 5 GB leaves 3 GB of an 8 GB host.
    mem_limit: ${API_MEM_LIMIT:-5g}
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  nginx:
    image: docker.io/library/nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../site:/var/www/site:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    # nginx reads its certificate once, at start: without a reload it keeps
    # serving the old one after certbot renews it (this let the live cert
    # expire on 2026-09-08 while renewed copies sat on disk). Reload every
    # 12 h — the same pace as certbot's renew loop; a reload drops no
    # connections.
    command: >
      /bin/sh -c 'while :; do sleep 12h & wait $${!}; nginx -s reload; done &
      exec nginx -g "daemon off;"'
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # Renews certificates via the webroot nginx serves at /.well-known/.
  # First issuance is done from the host BEFORE nginx can start with TLS —
  # see deploy/RUNBOOK.md "Launch sequence".
  certbot:
    image: docker.io/certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done'

  # ===========================================================================
  # GPU INSTANCE ONLY — LightOnOCR via vLLM (phase 2). Do NOT uncomment on the
  # CPU free-tier box: it requires an NVIDIA GPU + nvidia-container-toolkit.
  # Typically this runs on a SEPARATE g6.xlarge; the api service then points
  # ATTACHMENTS_LIGHTON_URL at that instance's private IP instead of a local
  # service. Keep port 8100 closed to the internet (security group: only the
  # CPU instance's SG may reach it).
  # ===========================================================================
  # vllm:
  #   image: docker.io/vllm/vllm-openai:latest
  #   restart: unless-stopped
  #   command: >
  #     --model lightonai/LightOnOCR-2-1B
  #     --port 8100
  #     --max-model-len 8192
  #   ports:
  #     - "8100:8100"
  #   volumes:
  #     - huggingface-cache:/root/.cache/huggingface
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]

volumes:
  certbot-etc:
  certbot-webroot:
  # huggingface-cache:   # GPU phase 2
