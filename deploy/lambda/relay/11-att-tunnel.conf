# attachments.dev: lambda (home) keeps an outbound SSH tunnel to this relay; Caddy serves
# api.attachments.dev and attachments.dev from 127.0.0.1:18820, the tunnel's end
# (/etc/caddy/conf.d/attachments.caddy). This account can do nothing else.
AllowUsers att-tunnel
Match User att-tunnel
	AllowTcpForwarding remote
	PermitListen 127.0.0.1:18820
	PermitOpen none
	GatewayPorts no
	PermitTTY no
	X11Forwarding no
	AllowAgentForwarding no
	ForceCommand /usr/sbin/nologin
